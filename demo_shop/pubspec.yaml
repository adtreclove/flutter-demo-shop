name: demo_shop
description: "A Flutter demo app for a shop."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.8
  flutter_riverpod: 3.3.2
  http: 1.6.0
  google_fonts: 6.3.2
  shared_preferences: 2.5.3
  get_it: 9.2.1
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.3
  flutter_native_splash: 2.4.4

  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: "assets/icon/algo_icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/icon/algo_icon_foreground.png"

flutter_native_splash:
  color: "#20201F"
  image: "assets/splash/algo_splash_logo.png"
  color_dark: "#09090B"
  image_dark: "assets/splash/algo_splash_logo.png"
  android_12:
    image: "assets/splash/algo_splash_logo.png"
    color: "#20201F"
    color_dark: "#09090B"
